@if(!loading()) {
<div class="parent">
  <div class="container" [ngClass]="isSignDivVisiable() ? 'active' :'' " id="container">
    <!-- Mobile segmented control: shows only on small screens -->
    <div class="mobile-switcher" role="tablist" aria-label="Authentication switch">
      <button type="button" role="tab" class="ms-btn" [class.active]="!isSignDivVisiable()"
        (click)="setIsSignDivVisiable(false)">Sign In</button>
      <button type="button" role="tab" class="ms-btn" [class.active]="isSignDivVisiable()"
        (click)="setIsSignDivVisiable(true)">Sign Up</button>
    </div>
    <div class="form-container" [class.sign-up]="!isMobile()">
      <form (ngSubmit)="onRegister()" [hidden]="!isSignDivVisiable()">
        <h1>Create Account</h1>
        <div class="social-icons">
          <a href="#" class="icon"><i class="bi bi-google"></i></a>
          <a href="#" class="icon"><i class="bi bi-facebook"></i></a>
          <a href="#" class="icon"><i class="bi bi-github"></i></a>
          <a href="#" class="icon"><i class="bi bi-linkedin"></i></a>
        </div>
        <span>or use your email for registeration</span>
        <input type="text" name="name" [(ngModel)]="loginName" placeholder="Name">
        <input type="email" name="email" [(ngModel)]="email" placeholder="Email">
        <input type="password" name="password" [(ngModel)]="password" placeholder="Password">
        <button type="submit" class="primary">Sign Up</button>
      </form>
    </div>
    <div class="form-container sign-in">
      <form (ngSubmit)="onLogin()" [hidden]="isSignDivVisiable()">
        <h1>Sign In</h1>
        <div class="social-icons">
          <!-- <a href="#" class="icon"><i class="fa-solid fa-light fa-plus fa-beat-fade fa-1x1"></i></a> -->
          <a href="#" class="icon"><i class="bi bi-google"></i></a>
          <a href="#" class="icon"><i class="bi bi-facebook"></i></a>
          <a href="#" class="icon"><i class="bi bi-github"></i></a>
          <a href="#" class="icon"><i class="bi bi-linkedin"></i></a>
        </div>
        <span>or use your email password</span>
        <input type="email" name="email" [(ngModel)]="email" placeholder="Email">
        <input type="password" name="password" [(ngModel)]="password" placeholder="Password">
        <a href="#">→ Forget Your Password? ←</a>
        <button type="submit" class="primary">Sign In</button>
      </form>
    </div>
    <div class="toggle-container">
      <div class="toggle">
        <div class="toggle-panel toggle-left hover:bg-blue-600">
          <h1>Welcome Back!</h1>
          <p>Enter your personal details to use all of site features</p>
          <button type="button" class="hover:bg-success" id="login" (click)="setIsSignDivVisiable(false)">Sign
            In</button>
        </div>
        <div class="toggle-panel toggle-right hover:bg-blue-600">
          <h1>Hello, Friend!</h1>
          <p>Register with your personal details to use all of site features</p>
          <button type="button" class="hover:btn-success" id="register" (click)="setIsSignDivVisiable(true)">Sign
            Up</button>
        </div>
      </div>
    </div>
  </div>
</div>
}

    <app-loading/>
} -->
