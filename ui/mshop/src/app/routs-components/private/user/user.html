@if(showGrid()){
<ithouse-grid [columnDefinitions]="columnDefinitions" [datasetObs]="userList"
  (onPaginationChanged)="paginationChanged($event)" [enablePagination]="true" [contextMenu]="contextMenu"
  [customPagination]="{pageSizes: [10, 20, 50, 100], pageSize: pageSize}">
</ithouse-grid>
}@else{
<ithouse-content-loader></ithouse-content-loader>
}
